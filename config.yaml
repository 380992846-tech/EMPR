# EMPR 默认配置（单一配置源）
#
# 注意：
#  - 提示词模板不在本文件——真正的模板在 src/prompts.py（本文件早期有个 prompts 段已删除，
#    因为 run_eval 实际用的是 prompts.py，避免双份不一致）。
#  - 模型池/评估超参/基准子集 都以本文件为准，各脚本通过 --flag 覆盖。

# 默认选择（不传参时用这里）
defaults:
  benchmark: "scibench"        # scibench | olympiadbench | mmlu_physics
  mode: "cot"                  # cot (零样本 CoT) | direct (直接答)
  model: "Qwen/Qwen2.5-14B-Instruct"

eval:
  # 对错判定容差
  answer_tolerance: 0.05        # 相对误差 <=5% 判对
  abs_tolerance: 0.01           # 近零答案用绝对差阈值
  seed: 42
  greedy: true                  # temperature=0，确定性
  bootstrap_iterations: 10000
  max_new_tokens: 1024

benchmarks:
  # SciBench 主基准。官方源 github.com/mandyyyyii/scibench。
  # 加载顺序：HF 候选 -> 本地 data/scibench/（download_data.py 生成，推荐）
  scibench:
    subsets: ["phys"]
  # 竞赛物理（HF，含官方 final_answer + solution）
  olympiadbench:
    subsets: ["physics"]
  # 可选 sanity check（MCQ）
  mmlu_physics:
    subsets: ["physics"]

models:
  # 核心默认池（默认单模型跑 defaults.model；--models core 跑这批；4090 友好）
  core:
    - "Qwen/Qwen2.5-7B-Instruct"
    - "Qwen/Qwen2.5-14B-Instruct"
    - "mistralai/Mistral-7B-Instruct-v0.3"
    - "meta-llama/Llama-3.1-8B-Instruct"        # 需 HF 授权（gated）
  # 大模型/额外（可选；需较大显存；用 --model 单独指定）
  large:
    - "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
    - "meta-llama/Llama-3.1-70B-Instruct"        # 需 A100-80G 或多卡
    - "Qwen/Qwen2.5-72B-Instruct"                # 需 A100-80G 或多卡

# 兼容旧用法：run_eval.py --models-all 会展开 core+large 的并集。
# 提示词请改 src/prompts.py。
